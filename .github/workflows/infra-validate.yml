name: Infrastructure Validation

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Bicep Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Azure CLI is pre-installed on GitHub-hosted runners.
      # We only use it for Bicep lint/build — no Azure login is needed.
      - name: Install Bicep CLI
        run: az bicep install

      - name: Lint Bicep templates
        run: az bicep lint --file infra/main.bicep

      - name: Build (compile to ARM)
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

