name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FinanceTracker.slnx

      - name: Build
        run: dotnet build FinanceTracker.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test FinanceTracker.slnx --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/FinanceTracker.Web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/FinanceTracker.Web

      - name: Lint
        run: npm run lint
        working-directory: src/FinanceTracker.Web

      - name: Build
        run: npm run build
        working-directory: src/FinanceTracker.Web

      - name: Test
        run: npm test -- --run
        working-directory: src/FinanceTracker.Web
